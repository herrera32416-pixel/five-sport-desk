<html lang="en" data-skin="fsl-20261111">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luis's Five-Sport Lab — PAPER</title>

<style>
:root{--bg:#07101c;--navy:#0a1628;--navy2:#10203a;--card:#152238;--box:#1b2b45;--gold:#f0c14b;--line:#243552;--text:#eef2f8;--muted:#8b97ad;--model:#7ec2ff;--pos:#3ddc97;--neg:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body{min-height:100%}
.top{background:var(--navy);border-bottom:1px solid var(--line)}
.top-inner,.nav-inner,.board{max-width:1100px;margin:0 auto;padding:0 14px}
.top-inner{padding:12px 14px 10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img,.brand svg{width:48px;height:48px;border-radius:10px;background:#081018;border:1px solid var(--line);flex-shrink:0}
.brand .t{font-size:22px;font-weight:800;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.paper-banner{background:#3a2a10;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;text-align:center}
.recstrip-top{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.rec-item{background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;line-height:1.2}
.rec-item .rlab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rec-item .usd.pos{color:var(--pos)}.rec-item .usd.neg{color:var(--neg)}
.rec-item.live{border-color:#1e6b4a}
.rec-note{font-size:11px;color:var(--muted);margin:2px 0 8px;line-height:1.4}
.navstick{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:1px solid var(--line)}
.nav-inner{padding:8px 14px 10px}
.dates,.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.dates{margin:0 0 8px}
.dates button,.tabs button{appearance:none;border:0;cursor:pointer;white-space:nowrap;font-weight:700}
.dates button{background:var(--navy2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px}
.dates button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.tabs button{background:var(--navy2);color:#d5deea;border-radius:999px;padding:8px 14px;font-size:14px}
.tabs button.on{background:var(--gold);color:#111}
.board{padding:12px 10px 40px}
.c{margin:0 0 10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid #3a4a63}
.c.hot{border-left-color:var(--gold)}
.ghead{display:flex;align-items:stretch;justify-content:space-between;gap:10px;margin-bottom:6px}
.teams{flex:1;min-width:0}
.tm{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:36px}
.tm+.tm{margin-top:4px}
.lgwrap{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#f4f7fb;border-radius:50%;overflow:hidden}
.lg{width:30px;height:30px;object-fit:contain;display:block}
.lgfb{display:none;width:36px;height:36px;border-radius:50%;background:#0d1a2e;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--gold)}
.lgfb.on{display:flex}
.tn{font-weight:800;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .at{color:var(--muted);font-weight:600;font-size:12px;margin-right:2px}
.meta{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex-shrink:0;text-align:right}
.when{font-size:12px;font-weight:700}
.meta .sp{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--gold);margin-top:2px}
.proj{font-size:12px;color:#9ec1e6;margin:0 0 8px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%}
.col{background:var(--box);border-radius:10px;padding:7px 6px 6px;min-width:0;overflow:hidden;display:flex;flex-direction:column;border:1px solid transparent}
.col.star{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mk{font-size:9px;letter-spacing:.08em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:4px}
.pk{font-size:12px;font-weight:700;margin:3px 0 2px;line-height:1.2;min-height:2.3em}
.mg{display:flex;gap:3px;margin:1px 0 2px}
.mg div{flex:1;background:#121c2e;border-radius:6px;padding:4px 0 3px;text-align:center;min-width:0}
.mg b{display:block;font-size:20px;color:var(--model);font-weight:800;line-height:1.05}
.mg span{font-size:8px;color:var(--muted)}
.px{font-size:13px;font-weight:800;color:#c9d3e0}
.mo{font-size:8px;color:var(--muted);margin-top:auto;padding-top:4px;line-height:1.2}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin:0 4px 0 0;color:#111}
.pill.bet{background:#3ddc97;color:#062}
.pill.pass{background:#3a3f4a;color:#9aa}
.pill.info{background:#5a4a1a;color:#f0c14b}
.elig{font-size:9px;font-weight:800;letter-spacing:.05em;margin-top:3px;padding:1px 6px;border-radius:999px}
.elig.on{background:#173d2c;color:#3ddc97}.elig.off{background:#2a2f3a;color:#8b97ad}
.gnote{font-size:11px;color:#9ec1e6;margin:6px 0 0;line-height:1.35}
.v3h{color:var(--gold)}
.tier-under{margin-top:4px;text-align:center;line-height:1.15}
.tier-under .paper{display:block;font-size:8px;color:var(--muted);font-weight:600;margin-top:2px}
.reason{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.3}
.empty{color:var(--muted);padding:24px 8px;text-align:center;font-weight:600}
.panel{overflow-x:auto;margin-top:8px}
.panel table{width:100%;border-collapse:collapse;font-size:12px}
.panel th,.panel td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top}
.panel th{color:var(--muted);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.warn{color:var(--gold);font-size:12px;margin:8px 0;line-height:1.45;font-weight:600}
.h{font-size:11px;color:var(--muted);font-weight:700;margin-top:16px}
.m{font-weight:700;font-size:16px;margin:3px 0 8px}
.rW{color:#3ddc97}.rL{color:#ff6b6b}.rP{color:#aaa}
.na{color:var(--muted)}
@media(max-width:640px){
  .brand .t{font-size:18px}
  .brand img,.brand svg{width:40px;height:40px}
  .tm{grid-template-columns:28px minmax(0,1fr) auto;gap:6px}
  .lgwrap,.lgfb{width:28px;height:28px}
  .lg{width:22px;height:22px}
  .tn{font-size:13px}
  .mg b{font-size:17px}
  .board{padding:8px 6px 32px}
  .c{padding:10px 8px}
  .recstrip-top{flex-wrap:nowrap;overflow-x:auto}
  .rec-item{flex-shrink:0}
}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('desk-data').textContent);
const TABS = ['ALL','NBA','NFL','NHL','CBB','CFB','BACKTEST'];
let tab='ALL', day='ALL';
const usd = (x)=> x==null?'—':((x>0?'+':x<0?'-':'')+'$'+Math.abs(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const amer = (x)=>{ if(x==null||x==='') return ''; const n=Number(x); if(!isFinite(n)) return ''; return (n>0?'+':'')+Math.round(n); };
function recItem(lab, rec, extra){
  if(!rec || !rec.n) return `<div class="rec-item"><span class="rlab">${lab}</span> —</div>`;
  const cls = (rec.pnl||0)>=0?'pos':'neg';
  return `<div class="rec-item${extra||''}"><span class="rlab">${lab}</span> ${rec.record} <span class="usd ${cls}">${rec.pnl_s}</span></div>`;
}
function header(){
  document.getElementById('subline').textContent = D.subtitle + ' · built ' + D.generated_ct;
  const V=D.v3||{}; const R=V.record_holdout||D.record_holdout;
  const el=(V.eligible_sports||[]).map(s=>s.toUpperCase()).join(', ')||'none';
  document.getElementById('recstrip').innerHTML =
    recItem('v3 holdout paper', R.ALL, ' live') +
    ['nfl','nba','nhl','cbb'].filter(s=>R[s]&&R[s].n).map(s=>recItem(s.toUpperCase(), R[s])).join('') +
    `<div class="rec-item"><span class="rlab">PLAY-eligible</span> ${el}</div>` +
    recItem('v2 holdout (old)', D.record_holdout.ALL);
  document.getElementById('recnote').textContent =
    'own_frozen_v3 · headline = blended model % (λ fit on tune), raw model % small · $20 flat · ★ PLAY ≥4 pts blended edge (≥6 in 50–60% toss-ups), −250 to +250, max 5/day across sports · PLAY only in eligible sports, others INFO · CFB info only · ML only, no parlays/teasers · ' + D.model_version + ' · ' + D.status;
}
function chips(){
  const days = ['ALL', ...[...new Set(D.games.map(g=>g.day).filter(Boolean))].sort()];
  const names = {ALL:'All days'};
  document.getElementById('datechips').innerHTML = days.map(d=>{
    let lab=d;
    if(d!=='ALL'){ const dt=new Date(d+'T12:00:00'); lab=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Chicago'}); }
    return `<button type="button" data-d="${d}" class="${d===day?'on':''}">${lab}</button>`;
  }).join('');
  document.getElementById('tabs').innerHTML = TABS.map(t=>`<button type="button" data-t="${t}" class="${t===tab?'on':''}">${t==='BACKTEST'?'Backtest':(t==='ALL'?'All':t)}</button>`).join('');
  document.getElementById('datechips').onclick=e=>{const b=e.target.closest('button'); if(!b)return; day=b.dataset.d; render();};
  document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return; tab=b.dataset.t; render();};
}
function fb(name){ return (name||'?').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(); }
function card(g){
  const hot = g.rule_status==='PLAY';
  const st = g.rule_status||'PASS';
  const pillCls = st==='PLAY'?'bet':(st==='INFO'?'info':'pass');
  const notes = [g.goalie_note?('Goalies — '+g.goalie_note):'', g.injury_note||'', g.schedule_note||''].filter(Boolean);
  const pickName = g.pick_side==='home'?g.home:g.pick_side==='away'?g.away:'';
  const price = amer(g.pick_price);
  const mlH = amer(g.ml_home), mlA=amer(g.ml_away);
  const logo = (url, name, side)=>{
    const fbEl = `<span class="lgfb" data-fb="${side}">${fb(name)}</span>`;
    if(!url) return `<div class="lgwrap">${fbEl.replace('lgfb','lgfb on')}</div>`;
    return `<div class="lgwrap"><img class="lg" src="${url}" alt="" onerror="this.style.display='none';this.parentNode.querySelector('.lgfb').classList.add('on')">${fbEl}</div>`;
  };
  const proj = (g.proj_h!=null && g.proj_a!=null) ? `Proj ${g.proj_a}–${g.proj_h} (model)` : '';
  return `<article class="c${hot?' hot':''}">
    <div class="ghead">
      <div class="teams">
        <div class="tm">${logo(g.away_logo,g.away,'a')}<div class="tn"><span class="at">@</span>${escapeHtml(g.away)}</div></div>
        <div class="tm">${logo(g.home_logo,g.home,'h')}<div class="tn">${escapeHtml(g.home)}</div></div>
      </div>
      <div class="meta"><div class="when">${g.when||''}</div><div class="sp">${g.sport}</div><div class="elig ${g.play_eligible_sport?'on':'off'}">${g.play_eligible_sport?'PLAY-ELIGIBLE':'INFO ONLY'}</div></div>
    </div>
    ${proj?`<div class="proj">${proj}</div>`:''}
    <div class="cols">
      <div class="col">
        <div class="mk">${g.p_is_blend?'BLENDED MODEL %':'MODEL %'}</div>
        <div class="mg">
          <div><b>${g.p_away==null?'—':g.p_away+'%'}</b><span>away</span></div>
          <div><b>${g.p_home==null?'—':g.p_home+'%'}</b><span>home</span></div>
        </div>
        ${g.p_tie!=null?`<div class="mo">tie ${g.p_tie}%</div>`:''}
        ${g.p_is_blend && (g.p_away_raw!=null||g.p_home_raw!=null)
          ? `<div class="mo">raw model ${g.p_away_raw==null?'—':g.p_away_raw+'%'} / ${g.p_home_raw==null?'—':g.p_home_raw+'%'}${g.blend_lambda!=null?' · λ='+Number(g.blend_lambda).toFixed(2)+(g.blend_space?' '+g.blend_space:'')+(g.blend_unvalidated?' unval.':''):''}</div>`
          : `<div class="mo">${g.p_is_blend?'blended model % · no raw':'raw simulator · no market to blend'}</div>`}
      </div>
      <div class="col${hot?' star':''}">
        <div class="mk">MONEYLINE</div>
        <div class="pk">${pickName?escapeHtml(pickName)+(price?' · '+price:''):(mlH||mlA?('H '+(mlH||'—')+' · A '+(mlA||'—')):'—')}</div>
        <div class="px">${g.stake?('$'+g.stake+' flat'):''}</div>
        <div class="mo">${g.odds_provider?escapeHtml(g.odds_provider)+' listed (not guaranteed Bovada close)':'no logged price'}</div>
      </div>
      <div class="col">
        <div class="mk">RULES</div>
        <div class="tier-under">
          <span class="pill ${pillCls}">${st}</span>
          <span class="paper">PAPER</span>
        </div>
        <div class="reason">${escapeHtml(g.rule_reason||'')}${g.pick_edge!=null?' · edge '+g.pick_edge+' pts':''}</div>
      </div>
    </div>
    ${notes.length?`<div class="gnote">${notes.map(escapeHtml).join(' · ')}</div>`:''}
  </article>`;
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function board(){
  let gs = D.games;
  if(tab!=='ALL' && tab!=='BACKTEST') gs = gs.filter(g=>g.sport===tab);
  if(day!=='ALL') gs = gs.filter(g=>g.day===day);
  if(!gs.length){
    return `<div class="empty">No pregame slate in this view. ${D.games.length? 'Try another date or tab.':'No upcoming games could be matched with finite features — see the Backtest tab for held-out paper results.'}</div>`;
  }
  const nPlay = gs.filter(g=>g.rule_status==='PLAY').length, nInfo = gs.filter(g=>g.rule_status==='INFO').length;
  return `<div class="rec-note">${gs.length} games · ${nPlay} PLAY under own_frozen_v3 · ${nInfo} INFO (edge clears but sport is info only) · rest PASS · PAPER</div>` + gs.map(card).join('');
}
function mrow(sp,w){
  const m=(D.metrics[sp]||[]).find? null : D.metrics[sp.toLowerCase()];
  return m;
}
function backtest(){
  const R=D.record_holdout, T=D.record_tune;
  const sports=['nfl','nba','nhl','cfb','cbb'];
  const metHead = `<tr><th>Sport</th><th>N</th><th>W/ mkt</th><th>Model LL</th><th>Baseline LL</th><th>Market LL</th><th>Model Brier</th><th>Base Brier</th><th>Market Brier</th><th>Margin MAE</th><th>Total MAE</th></tr>`;
  function metTable(window){
    return `<div class="panel"><table>${metHead}`+sports.map(sp=>{
      const m=D.metrics[sp][window]; if(!m) return '';
      const na=v=>v==null?'—':v;
      return `<tr><td>${sp.toUpperCase()}</td><td>${m.n}</td><td>${m.n_mkt}</td><td>${m.model_ll}</td><td>${m.base_ll}</td><td>${na(m.mkt_ll)}</td><td>${m.model_br}</td><td>${m.base_br}</td><td>${na(m.mkt_br)}</td><td>${m.mae_m}</td><td>${m.mae_t}</td></tr>`;
    }).join('')+`</table></div>`;
  }
  function paperTable(obj, lab){
    return `<div class="panel"><table><tr><th>Sport</th><th>Bets</th><th>Record</th><th>Net $</th><th>ROI</th><th>Max DD</th><th>Bets/day</th></tr>`+
      ['nfl','nba','nhl','cfb','cbb','ALL'].map(sp=>{
        const r=obj[sp]; if(!r||!r.n) return `<tr><td>${sp.toUpperCase()}</td><td>0</td><td colspan="5" class="na">${sp==='cbb'?'no historical moneylines':'—'}</td></tr>`;
        const cls=(r.pnl||0)>=0?'rW':'rL';
        const roi=r.roi==null?'—':(r.roi*100).toFixed(2)+'%';
        return `<tr><td>${sp.toUpperCase()}</td><td>${r.n}</td><td>${r.record}</td><td class="${cls}">${r.pnl_s}</td><td>${roi}</td><td>${usd(r.dd)}</td><td>${r.bpd} (max ${r.bpd_max})</td></tr>`;
      }).join('')+`</table></div>`;
  }

  function blendMetTable(bm, window){
    const rows=['nfl','nba','nhl','cfb','cbb'].map(sp=>{
      const b=(bm[sp]||{})[window]||{};
      if(!b.n) return `<tr><td>${sp.toUpperCase()}</td><td>0</td><td colspan="8" class="na">${sp==='cbb'?'no historical moneylines (λ unvalidated)':'—'}</td></tr>`;
      const cell=(o,key)=>o&&o[key]!=null?Number(o[key]).toFixed(4):'—';
      return `<tr><td>${sp.toUpperCase()}</td><td>${b.n}</td>`+
        `<td>${cell(b.model_cal,'log_loss')}</td><td>${cell(b.blend,'log_loss')}</td><td>${cell(b.market,'log_loss')}</td>`+
        `<td>${cell(b.model_cal,'brier')}</td><td>${cell(b.blend,'brier')}</td><td>${cell(b.market,'brier')}</td>`+
        `<td>${b.blend&&b.blend.lambda!=null?Number(b.blend.lambda).toFixed(2)+' '+(b.blend.space||''):'—'}</td></tr>`;
    }).join('');
    return `<div class="panel"><table><tr><th>Sport</th><th>N (w/ ML)</th><th>Cal LL</th><th>Blend LL</th><th>Mkt LL</th><th>Cal Brier</th><th>Blend Brier</th><th>Mkt Brier</th><th>λ</th></tr>${rows}</table></div>`;
  }

  let bets = D.holdout_bets||[];
  const betRows = bets.slice().reverse().slice(0,400).map(b=>{
    const cls=b.outcome==1?'rW':(b.outcome==0?'rL':'rP');
    const oc=b.outcome==1?'W':(b.outcome==0?'L':'P');
    return `<tr><td>${b.sport}</td><td>${b.season||''}</td><td>${escapeHtml(b.away)} @ ${escapeHtml(b.home)}</td><td>${b.side} ${amer(b.price)}</td><td>${b.edge==null?'':b.edge+' pts'}</td><td class="${cls}">${oc}</td><td class="${cls}">${usd(b.pnl)}</td></tr>`;
  }).join('');
  const V=D.v3||{};
  const f4=x=>x==null?'—':Number(x).toFixed(4);
  const predRows=['nfl','nba','nhl','cbb','cfb'].map(sp=>{const p=(V.predictive||{})[sp]||{};
    return `<tr><td>${sp.toUpperCase()}</td><td>${p.n_common_market||0}</td><td>${f4(p.v2_blend_ll)}</td><td>${f4(p.v3_blend_ll)}</td><td>${f4(p.market_ll)}</td><td>${f4(p.v2_cal_ll_all)}</td><td>${f4(p.v3_cal_ll_all)}</td><td>${p.n_holdout_v3||0}</td></tr>`;}).join('');
  const eligRows=Object.entries(V.eligibility||{}).map(([sp,e])=>`<tr><td>${sp.toUpperCase()}</td><td>${e.eligible?'<span class="rW">PLAY</span>':'info only'}</td><td>${e.lambda!=null?Number(e.lambda).toFixed(2)+' '+(e.space||'')+(e.lambda_validated?'':' (unval.)'):'—'}</td><td>${e.tune_info_gain==null?'—':Number(e.tune_info_gain).toFixed(4)}</td><td>${e.tune_paper&&e.tune_paper.n?e.tune_paper.record+' '+e.tune_paper.pnl_s:'—'}</td><td>${escapeHtml((e.reasons||[]).join('; '))}</td></tr>`).join('');
  const sensRows=Object.entries(V.sensitivity||{}).map(([k,r])=>`<tr><td>${k.toUpperCase()}</td><td>${r.n||0}</td><td>${r.n?r.record:'—'}</td><td class="${(r.pnl||0)>=0?'rW':'rL'}">${r.n?r.pnl_s:'—'}</td><td>${r.roi==null?'—':(r.roi*100).toFixed(2)+'%'}</td></tr>`).join('');
  const v3betRows=(V.holdout_bets||[]).slice().reverse().map(b=>{const cls=b.outcome==1?'rW':(b.outcome==0?'rL':'rP');const oc=b.outcome==1?'W':(b.outcome==0?'L':'P');
    return `<tr><td>${b.sport}</td><td>${b.season||''}</td><td>${escapeHtml(b.away)} @ ${escapeHtml(b.home)}</td><td>${b.side} ${amer(b.price)}</td><td>${b.edge} pts</td><td class="${cls}">${oc}</td><td class="${cls}">${usd(b.pnl)}</td></tr>`;}).join('');
  const RV=V.record_holdout||{};
  const v3sec = V.rule ? `
    <div class="warn v3h">v3 (own_frozen_v3) — official holdout paper ${RV.ALL&&RV.ALL.n?RV.ALL.record+', '+RV.ALL.pnl_s+', ROI '+((RV.ALL.roi||0)*100).toFixed(2)+'%':'0 bets'} · PLAY-eligible: ${(V.eligible_sports||[]).map(s=>s.toUpperCase()).join(', ')||'none'}. Features, alpha, decay, calibration, λ and eligibility were all chosen on the tune window; the holdout was graded once.</div>
    <div class="h">v3 HOLDOUT PREDICTIVE — log loss, lower is better (same games with a two-way moneyline; CBB has none)</div>
    <div class="panel"><table><tr><th>Sport</th><th>N w/ ML</th><th>v2 blend</th><th>v3 blend</th><th>Market</th><th>v2 cal (all)</th><th>v3 cal (all)</th><th>N all</th></tr>${predRows}</table></div>
    <div class="h">v3 PLAY ELIGIBILITY (decided on tune)</div>
    <div class="panel"><table><tr><th>Sport</th><th>Status</th><th>λ</th><th>Tune info gain</th><th>Tune paper</th><th>Why</th></tr>${eligRows}</table></div>
    <div class="h">v3 HOLDOUT PAPER — official (eligible sports only, global limits)</div>
    ${paperTable(RV)}
    <div class="h">v3 HOLDOUT SENSITIVITY — same rules, each sport alone / pooled (NOT official)</div>
    <div class="panel"><table><tr><th>Stream</th><th>Bets</th><th>Record</th><th>Net $</th><th>ROI</th></tr>${sensRows}</table></div>
    <div class="h">v3 HOLDOUT PAPER BETS</div>
    <div class="panel"><table><tr><th>Sport</th><th>Season</th><th>Game</th><th>Side / price</th><th>Edge</th><th>Res</th><th>$</th></tr>${v3betRows||'<tr><td colspan="7">None</td></tr>'}</table></div>
    <div class="h" style="margin-top:28px">— v2 and v1 below, kept for the record —</div>` : '';
  return v3sec + `
    <div class="warn">PAPER / BACKTEST. λ was fit on the tune window only; the holdout was graded once. Official book is own_frozen_v2 (blended p*, global 5/day). Combined v2 holdout is ${R.ALL.record}, ${R.ALL.pnl_s}, ROI ${((R.ALL.roi||0)*100).toFixed(2)}%, max drawdown ${usd(R.ALL.dd)}. If λ is near 1 the blend equals the market and edges vanish. This does not authorize live betting. Frozen λ (logit except CBB): ${Object.entries((D.lambdas||{})).map(([k,v])=>k.toUpperCase()+'='+(v.lambda!=null?Number(v.lambda).toFixed(2):'?')+(v.unvalidated?' unval.':'')).join(', ')}.</div>
    <div class="h">FROZEN RULES (own_frozen_v2)</div>
    <div class="m">$20 flat · ML only · blended p* · ≥${D.rule.min_edge_pts} pts blended edge · ${D.rule.price_bounds} · max ${D.rule.max_per_day}/day GLOBAL · daily stop ${usd(D.rule.daily_stop)} · weekly stop ${usd(D.rule.weekly_stop)} · no parlays or teasers. v1 (unblended, per-sport 5/day) is kept for the record.</div>
    <div class="h">HOLDOUT PAPER — v2 official (blend + global 5/day)</div>
    ${paperTable(R)}
    ${D.record_holdout_v1?`<div class="h">HOLDOUT PAPER — v1 published (unblended, per-sport 5/day)</div>${paperTable(D.record_holdout_v1)}`:''}
    ${D.record_holdout_v1_global?`<div class="h">HOLDOUT SENSITIVITY — v1 unblended, global 5/day (cap fix only)</div>${paperTable(D.record_holdout_v1_global)}`:''}
    ${D.record_holdout_v2_persport?`<div class="h">HOLDOUT SENSITIVITY — v2 blend, per-sport 5/day (blend only)</div>${paperTable(D.record_holdout_v2_persport)}`:''}
    <div class="h">TUNE PAPER — v2 official</div>
    ${paperTable(T)}
    ${D.record_tune_v1?`<div class="h">TUNE PAPER — v1 (unblended, per-sport)</div>${paperTable(D.record_tune_v1)}`:''}
    <div class="h">HOLDOUT PREDICTIVE METRICS (model vs blend vs market)</div>
    <div class="rec-note">Lower log loss and Brier are better. Same games with a two-way moneyline. Blend uses p* with λ frozen on tune. CBB has no historical market.</div>
    ${D.blend_metrics ? blendMetTable(D.blend_metrics, 'holdout') : metTable('holdout')}
    <div class="h">TUNE PREDICTIVE METRICS</div>
    ${metTable('tune')}
    <div class="h">HOLDOUT PAPER BETS (frozen rules, $20 flat)</div>
    <div class="panel"><table><tr><th>Sport</th><th>Season</th><th>Game</th><th>Side / price</th><th>Edge</th><th>Res</th><th>$</th></tr>${betRows||'<tr><td colspan="7">None</td></tr>'}</table></div>
    <div class="rec-note" style="margin-top:16px">${(D.notes||[]).map(escapeHtml).join(' · ')}</div>
  `;
}
function render(){
  chips();
  const el=document.getElementById('board');
  el.innerHTML = (tab==='BACKTEST') ? backtest() : board();
}
function headerAndGo(){ header(); render(); }
headerAndGo();
</script>
